# render.yaml — Render Blueprint. Deploy: render.com -> New -> Blueprint -> выбрать этот репозиторий/форк.
# Render сам создаёт сервис по этому файлу и просит заполнить переменные без sync: false ниже.
#
# ВАЖНО про бесплатный план (free) — подробно в docs/RENDER.md:
# - сервис засыпает после 15 минут без ВХОДЯЩИХ запросов; long-polling Telegram — исходящий трафик
#   и сон не предотвращает, поэтому пока сервис спит, команды боту не обрабатываются;
# - пробуждение ~1 минута; VK не дождётся "ok", повторит событие через 10 с, 3 мин, ... — дубли
#   отсекает дедуп, но несколько ошибок подряд VK может расценить как недоступность сервера;
# - 750 бесплатных часов в месяц на весь workspace; 24/7 одного сервиса — 720–744 ч;
# - Node.js закреплён через "engines" в package.json (без верхней границы Render берёт latest).

services:
  - type: web
    name: argus-vk-tg
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # autoDeploy устарел (render.com/docs/blueprint-spec) — заменён на autoDeployTrigger.
    autoDeployTrigger: commit
    envVars:
      - key: VK_GROUP_ID
        sync: false
      - key: VK_SECRET_KEY
        sync: false
      - key: VK_SERVICE_KEY
        sync: false
      - key: VK_CONFIRMATION_CODE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # ID базы Firestore; без переменной — "default" (см. docs/FIREBASE_SETUP.md)
      - key: FIREBASE_FIRESTORE_DATABASE_ID
        value: default
      - key: LEAD_CHAT_ID
        sync: false
      - key: DEBUG_CHAT_ID
        sync: false
      - key: STATS_CHAT_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: TELEGRAM_TOPIC_MAIN_ID
        sync: false
      - key: TELEGRAM_TOPIC_LEAD_ID
        sync: false
      - key: TELEGRAM_TOPIC_DEBUG_ID
        sync: false
      - key: TELEGRAM_TOPIC_STATS_ID
        sync: false
      - key: STATS_DIGEST_HOURS
        sync: false
      - key: BOT_VERSION
        sync: false
